server:
  port: 8888

spring:
  application:
    name: corp-trip-agent
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/corptrip?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
  # 集成Redis
  data:
    redis:
      host: localhost  # redis的ip
      port: 6379  # redis的端口
      password: 123456 # 如果redis没有配置密码就删除这行配置
      database: 4  # 指定使用索引为5的数据库（0-15可选）
      # 认证查询依赖 Redis；限制网络故障时单个请求的等待时间，避免卡在 StpUtil.checkLogin。
      connect-timeout: 3s
      timeout: 3s
      lettuce:
        shutdown-timeout: 2s